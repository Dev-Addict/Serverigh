<form
	class="write-upload-form"
	action="/actions/upload"
	hx-post="/actions/upload"
	hx-target="#files-region"
	hx-swap="innerHTML"
	hx-encoding="multipart/form-data">
	<input type="hidden" name="path" value="{{ .Path }}">
	<input type="hidden" name="sort" value="{{ .Sort }}">
	<input type="hidden" name="dir" value="{{ .Direction }}">
	<label>
		<span>{{ .Label }}</span>
		{{ if .Folder }}
		<input
			type="file"
			name="file"
			multiple
			webkitdirectory
			data-write-upload>
		{{ else }}
		<input
			type="file"
			name="file"
			multiple
			data-write-upload>
		{{ end }}
	</label>
</form>
