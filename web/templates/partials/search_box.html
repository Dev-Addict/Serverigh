<div
	id="search-region"
	class="search-region"
	role="search"
	{{ if .OOB }}hx-swap-oob="true"{{ end }}>
	<input type="hidden" name="path" value="{{ .Path }}">
	<input type="hidden" name="sort" value="{{ .Sort }}">
	<input type="hidden" name="dir" value="{{ .Direction }}">
	<label class="search-label" for="global-search">Search</label>
	<div class="search-controls">
		<input
			id="global-search"
			class="search-input"
			type="search"
			name="q"
			autocomplete="off"
			minlength="2"
			placeholder="Search files"
			hx-get="/partials/search"
			hx-trigger="input changed delay:300ms, search"
			hx-target="#files-region"
			hx-include="#search-region input"
			hx-swap="innerHTML"
			hx-sync="#search-region:replace">
		<button
			class="settings-button"
			type="button"
			aria-label="Open settings"
			title="Settings"
			data-settings-open>
			{{ template "icon_settings.html" . }}
		</button>
	</div>
</div>
