<div
	id="settings-modal"
	class="modal-backdrop"
	role="presentation"
	aria-hidden="true"
	data-settings-modal>
	<section
		class="settings-modal"
		role="dialog"
		aria-modal="true"
		aria-labelledby="settings-title"
		tabindex="-1">
		<header class="settings-modal-header">
			<h2 id="settings-title">Settings</h2>
			<button
				class="icon-button"
				type="button"
				aria-label="Close settings"
				title="Close settings"
				data-settings-close>
				{{ template "icon_close.html" . }}
			</button>
		</header>
		<div class="settings-modal-body">
			<label class="settings-field" for="theme-select">
				<span>Theme</span>
				<select id="theme-select" name="theme" data-theme-select>
					{{ if eq .Theme "light" }}
					<option value="light" selected>Light</option>
					{{ else }}
					<option value="light">Light</option>
					{{ end }}
					{{ if eq .Theme "dark" }}
					<option value="dark" selected>Dark</option>
					{{ else }}
					<option value="dark">Dark</option>
					{{ end }}
				</select>
			</label>
			<label class="settings-field" for="max-preview-bytes">
				<span>Max Preview Bytes</span>
				<input
					id="max-preview-bytes"
					type="number"
					min="1"
					value="{{ .MaxPreviewBytes }}"
					data-max-preview-bytes>
			</label>
			<section class="settings-section" aria-labelledby="columns-title">
				<h3 id="columns-title">Columns</h3>
				<label class="settings-check">
					<input
						type="checkbox"
						data-column-toggle="size"
						{{ if .Columns.Size }}checked{{ end }}>
					<span>Size</span>
				</label>
				<label class="settings-check">
					<input
						type="checkbox"
						data-column-toggle="modified"
						{{ if .Columns.Modified }}checked{{ end }}>
					<span>Modified</span>
				</label>
				<label class="settings-check">
					<input
						type="checkbox"
						data-column-toggle="created"
						{{ if .Columns.Created }}checked{{ end }}>
					<span>Created</span>
				</label>
				<label class="settings-check">
					<input
						type="checkbox"
						data-column-toggle="mode"
						{{ if .Columns.Mode }}checked{{ end }}>
					<span>Mode</span>
				</label>
			</section>
		</div>
	</section>
</div>
